  rest:     { name: 'Rest',                short: 'Rest',     color: '#CBD5E1', bg: '#F8FAFC', dur: '' }
};

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// Every-other-day: Mon Push · Wed Legs · Fri Pull (lift) — Tue/Thu/Sat Levine cardio — Sun rest.
// Cardio progression is the original Levine 24-month arc, relocated to Tue/Thu/Sat.
const SP = [
  { id:'1a', p:0, n:'Foundation',          ws:1,  we:6,   t:[ {t:'push'}, {t:'base',w:30,m:50}, {t:'legs'}, {t:'base',w:30,m:50}, {t:'pull'}, {t:'base',w:30,m:50}, {t:'rest'} ] },
  { id:'1b', p:0, n:'Foundation Extended',  ws:7,  we:12,  t:[ {t:'push'}, {t:'base',w:40,m:60}, {t:'legs'}, {t:'base',w:40,m:60}, {t:'pull'}, {t:'base',w:30,m:50}, {t:'rest'} ] },
  { id:'2a', p:1, n:'Adding Distance',     ws:13, we:16,  t:[ {t:'push'}, {t:'base',w:40,m:60}, {t:'legs'}, {t:'long',w:45,m:55}, {t:'pull'}, {t:'base',w:30,m:50}, {t:'rest'} ] },
  { id:'2b', p:1, n:'First Intervals',     ws:17, we:22,  t:[ {t:'push'}, {t:'4x4',i:85}, {t:'legs'}, {t:'long',w:50,m:60}, {t:'pull'}, {t:'base',w:30,m:50}, {t:'rest'} ] },
  { id:'2c', p:1, n:'Pushing Intensity',   ws:23, we:28,  t:[ {t:'push'}, {t:'4x4',i:90}, {t:'legs'}, {t:'long',w:55,m:65}, {t:'pull'}, {t:'base',w:30,m:50}, {t:'rest'} ] },
  { id:'2d', p:1, n:'Ramping Up',          ws:29, we:34,  t:[ {t:'push'}, {t:'4x4',i:92}, {t:'legs'}, {t:'long',w:60,m:70}, {t:'pull'}, {t:'base',w:30,m:50}, {t:'rest'} ] },
  { id:'pk', p:2, n:'Two Intervals',       ws:35, we:40,  t:[ {t:'push'}, {t:'4x4',i:95}, {t:'legs'}, {t:'long',w:60,m:70}, {t:'pull'}, {t:'4x4',i:95}, {t:'rest'} ] },
  { id:'mt', p:3, n:'Sustained',           ws:41, we:104, t:[ {t:'push'}, {t:'4x4',i:95}, {t:'legs'}, {t:'long',w:60,m:70}, {t:'pull'}, {t:'base',w:45,m:65}, {t:'rest'} ] },
];

const PHASES = [
  { id:0, name:'Phase 1: Foundation', tab:'Phase 1',      ws:1,  we:12,  color:'#1E3A5F', bg:'#E2E8F0' },
  { id:1, name:'Phase 2: Build',     tab:'Phase 2',      ws:13, we:34,  color:'#C2410C', bg:'#FFF7ED' },
  { id:2, name:'Peak',               tab:'Peak',         ws:35, we:40,  color:'#B91C1C', bg:'#FEE2E2' },
  { id:3, name:'Maintenance',        tab:'Maintenance',  ws:41, we:104, color:'#334155', bg:'#F1F5F9' },
];

// ════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════

function dateFor(wk, dayIdx) {
  const d = new Date(START);
  d.setDate(d.getDate() + (wk - 1) * 7 + dayIdx);
  return d;
}
function dk(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmt(d) { return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function fmtDayName(d) { return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); }
function curWeek() {
  const diff = Math.floor((new Date() - START) / (7*24*60*60*1000));
  return Math.max(1, Math.min(104, diff + 1));
}
function getSP(wk) { return SP.find(s => wk >= s.ws && wk <= s.we); }
function sessionsInWeek(wk) {
  const sp = getSP(wk);
  return sp ? sp.t.filter(d => d.t !== 'rest').length : 0;
}
function weekDates(wk) { return DAYS.map((_,i) => dateFor(wk, i)); }
function isWeekComplete(wk, completed) {
  const sp = getSP(wk);
  if (!sp) return false;
  return sp.t.every((d, i) => d.t === 'rest' || completed[dk(dateFor(wk, i))]);
}
function completedInWeek(wk, completed) {
  const sp = getSP(wk);
  if (!sp) return 0;
  return sp.t.reduce((n, d, i) => n + (d.t !== 'rest' && completed[dk(dateFor(wk, i))] ? 1 : 0), 0);
}
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveNotes(n) { localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(n)); }

// ════════════════════════════════════════
// SUPABASE FUNCTIONS
// ════════════════════════════════════════

async function loadFromSupabase(userId) {
  try {
    const { data, error } = await sb
      .from('completed_days')
      .select('date_key')
      .eq('user_id', userId);

    if (error) throw error;

    const result = {};
    if (data) {
      data.forEach(row => {
        result[row.date_key] = true;
      });
    }
    return result;
  } catch (err) {
    console.error('Error loading from Supabase:', err);
    return {};
  }
}

async function syncToggle(userId, dateKey, isCompleted) {
  try {
    if (isCompleted) {
      await sb
        .from('completed_days')
        .upsert({ user_id: userId, date_key: dateKey }, { onConflict: 'user_id,date_key' });
    } else {
      await sb
        .from('completed_days')
        .delete()
        .eq('user_id', userId)
        .eq('date_key', dateKey);
    }
  } catch (err) {
    console.error('Error syncing toggle:', err);
  }
}

async function bulkSync(userId, completed) {
  try {
    const rows = Object.keys(completed).map(dateKey => ({
      user_id: userId,
      date_key: dateKey
    }));

    if (rows.length > 0) {
      await sb
        .from('completed_days')
        .upsert(rows, { onConflict: 'user_id,date_key' });
    }
  } catch (err) {
    console.error('Error bulk syncing:', err);
  }
}

async function loadNotesFromSupabase(userId) {
  try {
    const { data, error } = await sb
      .from('workout_notes')
      .select('date_key, note_text')
      .eq('user_id', userId);
    if (error) throw error;
    const result = {};
    if (data) data.forEach(row => { result[row.date_key] = row.note_text; });
    return result;
  } catch (err) {
    console.error('Error loading notes from Supabase:', err);
    return {};
  }
}

async function syncNote(userId, dateKey, noteText) {
  try {
    if (noteText && noteText.trim()) {
      await sb.from('workout_notes')
        .upsert({ user_id: userId, date_key: dateKey, note_text: noteText, updated_at: new Date().toISOString() },
          { onConflict: 'user_id,date_key' });
    } else {
      await sb.from('workout_notes')
        .delete().eq('user_id', userId).eq('date_key', dateKey);
    }
  } catch (err) {
    console.error('Error syncing note:', err);
  }
}

// ════════════════════════════════════════
// COMPONENTS
// ════════════════════════════════════════

function ProgressBar({ value, max, color='#22c55e', height=8, bg='#e5e7eb', label }) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return (
    <div>
      {label && <div className="flex justify-between text-xs text-gray-500 mb-1"><span>{label}</span><span>{pct}%</span></div>}
      <div className="rounded-full overflow-hidden" style={{ height, background: bg }}>
        <div className="h-full rounded-full transition-all duration-500" style={{ width: pct+'%', background: color }}></div>
      </div>
    </div>
  );
}

function TopBar({ cw, completed, user, onSignIn, onSignOut }) {
  const totalWeeks = 104;
  const completedWeeks = useMemo(() => {
    let n = 0;
    for (let w = 1; w <= Math.min(cw, totalWeeks); w++) if (isWeekComplete(w, completed)) n++;
    return n;
  }, [cw, completed]);

  const getUserInitial = () => {
    if (user?.user_metadata?.name) {
      return user.user_metadata.name.charAt(0).toUpperCase();
    }
    if (user?.email) {
      return user.email.charAt(0).toUpperCase();
    }
    return '?';
  };

  return (
    <div className="bg-gray-900 text-white px-4 py-4 sticky top-0 z-50 shadow-lg">
      <div className="max-w-5xl mx-auto">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h1 className="text-lg font-bold tracking-wide">LEVINE PROTOCOL</h1>
            <p className="text-xs text-gray-400">Heart &amp; Brain Cardio + Push / Legs / Pull</p>
          </div>
          <div className="flex items-center gap-3">
            <div className="text-right">
              <div className="text-sm font-semibold">Week {cw} of {totalWeeks}</div>
              <div className="text-xs text-gray-400">{completedWeeks} weeks completed</div>
            </div>
            {user ? (
              <div className="flex items-center gap-2">
                <div className="auth-avatar">{getUserInitial()}</div>
                <button onClick={onSignOut}
                  className="text-xs px-2 py-1 rounded border border-gray-600 hover:border-gray-400 transition-colors">
                  Sign out
                </button>
              </div>
            ) : (
              <button onClick={onSignIn}
                className="text-xs px-3 py-1.5 rounded bg-blue-600 hover:bg-blue-500 transition-colors font-medium">
                Sign in
              </button>
            )}
          </div>
        </div>
        <ProgressBar value={completedWeeks} max={totalWeeks} color="#22c55e" height={6} bg="#374151" />
      </div>
    </div>
  );
}

function TabNav({ active, onChange }) {
  const tabs = [...PHASES.map(p => p.tab), 'Lifting Guide', 'Stats'];
  return (
    <div className="bg-white border-b sticky top-[96px] z-40 shadow-sm">
      <div className="max-w-5xl mx-auto flex no-scroll overflow-x-auto">
        {tabs.map((t, i) => (
          <button key={t} onClick={() => onChange(i)}
            className={`px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition-colors ${
              active === i ? 'border-gray-900 text-gray-900' : 'border-transparent text-gray-500 hover:text-gray-700'
            }`}>{t}</button>
        ))}
      </div>
    </div>
  );
}

function DayCard({ dayName, date, workout, completed, notes, onToggle, onNoteChange, expanded, onExpand, week, isToday }) {
  const info = W[workout.t];
  const isRest = workout.t === 'rest';
  const isLift = info.kind === 'lift';
  const key = dk(date);
  const done = !!completed[key];
  const noteText = notes[key] || '';
  const isOpen = expanded === key;

  // Per-set reps + weight, stored as JSON under `${key}:lift` → { exIdx: { r:[...], w:[...] } }
  const liftRaw = notes[key + ':lift'];
  const lift = typeof liftRaw === 'string' ? (() => { try { return JSON.parse(liftRaw); } catch { return {}; } })() : (liftRaw || {});
  const liftHas = Object.values(lift).some(o => o && (((o.r || []).some(x => x && String(x).trim())) || ((o.w || []).some(x => x && String(x).trim()))));
  const hasNote = !!noteText || liftHas;
  const durStr = workout.w ? `${workout.w}m work / ${workout.m}m total` : (info.dur || '');
  const subtitle = isLift ? info.sub
    : workout.t === '4x4' ? `${workout.i}% peak HR · ${info.dur || ''}`.trim().replace(/·\s*$/, '')
    : durStr;

  const updateLift = (exIdx, field, setIdx, val) => {
    const next = { ...lift };
    const cur = { ...(next[exIdx] || {}) };
    const arr = [ ...((cur[field]) || []) ];
    arr[setIdx] = val;
    cur[field] = arr;
    next[exIdx] = cur;
    onNoteChange(key + ':lift', JSON.stringify(next));
  };

  if (isRest) {
    return (
      <div className="rounded-xl border border-gray-200 px-4 py-3 flex items-center justify-between" style={{ background: info.bg }}>
        <div className="flex items-center gap-3">
          <div className="w-1.5 h-9 rounded-full flex-shrink-0" style={{ background: info.color }}></div>
          <div>
            <div className="text-[11px] font-bold uppercase tracking-wide text-gray-500">{dayName} <span className="text-gray-400 normal-case font-normal">· {fmt(date)}</span></div>
            <div className="text-sm font-semibold text-gray-400">Rest day</div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={`rounded-2xl border bg-white transition-all overflow-hidden ${
        done ? 'border-green-300' : 'border-gray-200'} ${isToday ? 'ring-2' : ''}`}
      style={{ ringColor: isToday ? info.color : 'transparent' }}>

      {/* Collapsed header row — tap to toggle */}
      <div className="flex items-center gap-3 px-4 py-3 cursor-pointer select-none"
        style={{ background: isOpen ? info.bg : (done ? '#f0fdf4' : '#fff') }}
        onClick={() => onExpand(isOpen ? null : key)}>
        <div className="w-1.5 self-stretch rounded-full flex-shrink-0" style={{ background: info.color, minHeight: '2.75rem' }}></div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-[11px] font-bold uppercase tracking-wide text-gray-500">{dayName}</span>
            <span className="text-[11px] text-gray-400">{fmt(date)}</span>
            {isToday && <span className="text-[9px] font-bold text-white px-1.5 py-0.5 rounded-full" style={{ background: info.color }}>TODAY</span>}
            {hasNote && <span className="text-xs">📝</span>}
          </div>
          <div className="flex items-baseline gap-2 min-w-0">
            <span className="text-base font-bold flex-shrink-0" style={{ color: done ? '#16a34a' : info.color }}>{info.name}</span>
            {subtitle && <span className="text-[11px] text-gray-500 truncate">{subtitle}</span>}
          </div>
        </div>
        <button onClick={e => { e.stopPropagation(); onToggle(key); }}
          className={`w-8 h-8 rounded-lg border-2 flex items-center justify-center text-sm font-bold transition-all flex-shrink-0 ${
            done ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 hover:border-gray-400 text-transparent'
          }`}>✓</button>
        <div className="text-gray-300 flex-shrink-0 text-[10px]">{isOpen ? '▲' : '▼'}</div>
      </div>

      {/* Expanded body */}
      {isOpen && (
        <div className="px-4 pb-4 pt-1 fade-in border-t border-gray-100">
          {isLift && (
            <div className="text-[11px] text-gray-600 bg-gray-50 rounded-lg p-2.5 my-3 leading-relaxed">
              <strong>Progression:</strong> lead lift 3 sets (build 6→10 reps), accessories 2 sets (build 8→12). Add 2.5–5 lb once you top the range, then drop back down. Rest 1–3 min.
            </div>
          )}
          {isLift && (
            <div className="space-y-3">
              {info.exercises.map((ex, i) => {
                const label = ex.rotate ? ex.rotate[week % 2] : ex.n;
                const alt = ex.rotate ? ex.rotate[(week + 1) % 2] : null;
                return (
                  <div key={i} className="bg-gray-50 rounded-xl border border-gray-200 p-3">
                    <div className="flex items-baseline justify-between mb-2">
                      <div className="text-sm font-semibold text-gray-800">{i + 1}. {label}</div>
                      <div className="text-[11px] text-gray-400 flex-shrink-0 ml-2">{ex.sets} sets</div>
                    </div>
                    {alt && <div className="text-[10px] text-gray-400 italic mb-2">rotates weekly — alt: {alt}</div>}
                    <div className="space-y-1.5">
                      <div className="flex items-center gap-2 text-[9px] font-semibold text-gray-400 uppercase tracking-wide">
                        <div className="w-12 flex-shrink-0"></div>
                        <div className="flex-1 text-center">Reps</div>
                        <div className="flex-1 text-center">Weight</div>
                      </div>
                      {Array.from({ length: ex.sets }).map((_, s) => (
                        <div key={s} className="flex items-center gap-2">
                          <div className="w-12 flex-shrink-0 text-xs text-gray-400 font-medium">Set {s + 1}</div>
                          <input type="text" inputMode="numeric" placeholder="—"
                            value={(lift[i] && lift[i].r && lift[i].r[s]) || ''}
                            onChange={e => updateLift(i, 'r', s, e.target.value)}
                            className="flex-1 min-w-0 px-3 py-2 border border-gray-300 rounded-lg text-sm text-center bg-white focus:outline-none focus:ring-2 focus:ring-gray-400" />
                          <input type="text" inputMode="decimal" placeholder="lb"
                            value={(lift[i] && lift[i].w && lift[i].w[s]) || ''}
                            onChange={e => updateLift(i, 'w', s, e.target.value)}
                            className="flex-1 min-w-0 px-3 py-2 border border-gray-300 rounded-lg text-sm text-center bg-white focus:outline-none focus:ring-2 focus:ring-gray-400" />
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {info.steps && (
            <div className="space-y-1.5 my-3">
              {info.steps.map((s, i) => (
                <div key={i} className="text-xs text-gray-600 flex"><span className="text-gray-400 mr-2 flex-shrink-0">•</span><span>{s}</span></div>

          )}

            <div className="space-y-1 my-3">

            onChange={e => onNoteChange(key, e.target.value)}

}

function WeekSelector({ phase, selected, onChange, cw, completed }) {
  const ref = useRef(null);
  const weeks = [];
  for (let w = phase.ws; w <= phase.we; w++) weeks.push(w);

  useEffect(() => {
    if (ref.current) {
      const el = ref.current.querySelector(`[data-wk="${selected}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }, [selected]);

  return (
    <div ref={ref} className="flex gap-2 overflow-x-auto no-scroll py-3 px-4">
      {weeks.map(w => {
        const done = isWeekComplete(w, completed);
        const isCur = w === cw;
        const isSel = w === selected;
        return (
          <button key={w} data-wk={w} onClick={() => onChange(w)}
            className={`flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium transition-all ${
              isSel ? 'bg-gray-900 text-white shadow-md' :
              isCur ? 'bg-gray-200 text-gray-900 ring-2 ring-gray-900' :
              done ? 'bg-green-100 text-green-700' :
              'bg-gray-100 text-gray-500 hover:bg-gray-200'
            }`}>
            {done && !isSel ? '✓ ' : ''}Wk {w}
          </button>
        );
      })}
    </div>
  );
}

function PhaseView({ phaseIdx, cw, completed, notes, onToggle, onNoteChange }) {
  const phase = PHASES[phaseIdx];
  const initWeek = Math.max(phase.ws, Math.min(cw, phase.we));
  const [selWeek, setSelWeek] = useState(initWeek);

  const todayKey = dk(new Date());
  const todayKeyInWeek = (wk) => {
    const d = weekDates(wk).find(dt => dk(dt) === todayKey);
    return d ? dk(d) : null;
  };

  // Accordion: one open day at a time. Default-open today (if it's in this week).
  const [expanded, setExpanded] = useState(() => todayKeyInWeek(initWeek));

  useEffect(() => {
    setSelWeek(Math.max(phase.ws, Math.min(cw, phase.we)));
  }, [phaseIdx, cw]);

  // When the selected week changes, auto-open today (or collapse all if today isn't in it).
  useEffect(() => {
    setExpanded(todayKeyInWeek(selWeek));
  }, [selWeek]);

  const sp = getSP(selWeek);
  const dates = weekDates(selWeek);
  const done = completedInWeek(selWeek, completed);
  const total = sessionsInWeek(selWeek);

  return (
    <div className="max-w-2xl mx-auto px-4 py-4">
      {/* Phase header */}
      <div className="flex items-center justify-between mb-3">
        <div>
          <h2 className="text-2xl font-bold" style={{ color: phase.color }}>{phase.name}</h2>
          {sp && <p className="text-xs text-gray-600 mt-1">{sp.n}</p>}
        </div>
        <div className="text-right">
          <div className="text-lg font-bold text-gray-900">{done}/{total}</div>
          <div className="text-xs text-gray-400">Week {selWeek}</div>
        </div>
      </div>

      <ProgressBar value={done} max={total} color={phase.color} height={8} />

      <WeekSelector phase={phase} selected={selWeek} onChange={setSelWeek} cw={cw} completed={completed} />

      {sp && (
        <div className="space-y-3 mt-2">
          {sp.t.map((workout, i) => (
            <DayCard key={i} dayName={DAYS[i]} date={dates[i]} workout={workout}
              completed={completed} notes={notes} onToggle={onToggle} onNoteChange={onNoteChange}
              expanded={expanded} onExpand={setExpanded} week={selWeek}
              isToday={selWeek === cw && dk(dates[i]) === todayKey} />
          ))}
        </div>
      )}
    </div>
  );
}

function StatsView({ cw, completed, setCompleted, setNotes, onTabChange, user, onSignIn, onSignOut }) {
  const [syncMsg, setSyncMsg] = useState('');
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState('');
  const [showManualSync, setShowManualSync] = useState(false);
  const stats = useMemo(() => {
    let totalSched = 0, totalDone = 0, streak = 0;
    const phaseStats = PHASES.map(p => ({ ...p, sched: 0, done: 0, weeksComplete: 0, totalWeeks: p.we - p.ws + 1 }));

    for (let w = 1; w <= 104; w++) {
      const sess = sessionsInWeek(w);
      const done = completedInWeek(w, completed);
      const wComplete = isWeekComplete(w, completed);

      if (w <= cw) { totalSched += sess; totalDone += done; }

      const pi = PHASES.findIndex(p => w >= p.ws && w <= p.we);
      if (pi >= 0) {
        phaseStats[pi].sched += sess;
        phaseStats[pi].done += done;
        if (wComplete) phaseStats[pi].weeksComplete++;
      }
    }

    for (let w = cw; w >= 1; w--) {
      if (isWeekComplete(w, completed)) streak++;
      else break;
    }

    const curPhase = PHASES.find(p => cw >= p.ws && cw <= p.we) || PHASES[0];
    const curSP = getSP(cw);

    return { totalSched, totalDone, streak, phaseStats, curPhase, curSP };
  }, [cw, completed]);

  const curDates = weekDates(cw);
  const curSPData = getSP(cw);
  const curDone = completedInWeek(cw, completed);
  const curTotal = sessionsInWeek(cw);

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 space-y-6">
      {/* Current Status */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h2 className="text-lg font-bold text-gray-900">Current Status</h2>
            <p className="text-sm text-gray-500">{stats.curPhase.name} — Week {cw} of 104</p>
            {stats.curSP && <p className="text-xs text-gray-400">{stats.curSP.n}</p>}
          </div>
          <div className="text-right">
            {stats.streak > 0 && (
              <div className="inline-flex items-center bg-green-50 text-green-700 px-3 py-1 rounded-full text-sm font-semibold">
                🔥 {stats.streak} week streak
              </div>
            )}
          </div>
        </div>
        <ProgressBar value={stats.totalDone} max={stats.totalSched} color="#22c55e" height={10}
          label={`${stats.totalDone} of ${stats.totalSched} sessions completed`} />
      </div>

      {/* This Week */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-gray-900">This Week</h3>
          <span className="text-sm text-gray-500">{curDone}/{curTotal} sessions</span>
        </div>
        {curSPData && (
          <div className="grid grid-cols-7 gap-2">
            {curSPData.t.map((workout, i) => {
              const info = W[workout.t];
              const done = completed[dk(curDates[i])];
              const isRest = workout.t === 'rest';
              return (
                <div key={i} className="text-center">
                  <div className="text-[10px] font-medium text-gray-400 mb-1">{DAYS[i]}</div>
                  <div className={`w-9 h-9 mx-auto rounded-lg flex items-center justify-center text-xs font-bold ${
                    done ? 'bg-green-500 text-white' : isRest ? 'bg-gray-100 text-gray-300' : 'text-white'
                  }`} style={!done && !isRest ? { background: info.color } : {}}>
                    {done ? '✓' : isRest ? '–' : info.short.charAt(0)}
                  </div>
                  <div className="text-[9px] text-gray-400 mt-0.5">{info.short}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Phase Cards */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {stats.phaseStats.map((ps, i) => {
          const isActive = cw >= ps.ws && cw <= ps.we;
          const isFuture = cw < ps.ws;
          const pct = ps.sched > 0 ? Math.round((ps.done / ps.sched) * 100) : 0;
          const status = isFuture ? 'Not Started' : (ps.weeksComplete === ps.totalWeeks ? 'Complete' : 'In Progress');

          return (
            <div key={i} className={`rounded-2xl p-4 border transition-all cursor-pointer hover:shadow-md ${
              isActive ? 'ring-2 shadow-sm' : ''
            }`}
              style={{
                background: isActive ? ps.bg : '#fff',
                borderColor: isActive ? ps.color : '#e5e7eb',
                ringColor: isActive ? ps.color : undefined,
              }}
              onClick={() => onTabChange(i)}
            >
              <div className="flex items-center justify-between mb-2">
                <h4 className="font-bold text-sm" style={{ color: ps.color }}>{ps.name}</h4>
                <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${
                  status === 'Complete' ? 'bg-green-100 text-green-700' :
                  status === 'In Progress' ? 'bg-blue-100 text-blue-700' :
                  'bg-gray-100 text-gray-500'
                }`}>{status}</span>
              </div>
              <div className="text-xs text-gray-500 mb-2">Weeks {ps.ws}–{ps.we} • {ps.totalWeeks} weeks</div>
              <ProgressBar value={ps.done} max={ps.sched} color={ps.color} height={6} />

                <span>{ps.done}/{ps.sched} sessions</span>
                <span>{ps.weeksComplete}/{ps.totalWeeks} weeks</span>

          {[
            { n: '+18%', l: 'VO2 Max Increase' },
            { n: '+25%', l: 'LV Compliance' },
            { n: '20 yrs', l: 'Heart Age Reversed' },
            { n: '< 65', l: 'Window Closes (Age)' },

              <div className="text-2xl font-bold text-gray-900">{s.n}</div>
              <div className="text-xs text-gray-500">{s.l}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Sync & Data */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border">
        {user ? (
          <>
            <div className="flex items-center justify-between mb-3">
              <div>
                <h3 className="font-bold text-gray-900">Cloud Sync Status</h3>
                <p className="text-xs text-gray-500">{user.email}</p>
              </div>
              <div className="text-green-600 font-semibold text-sm">Synced to cloud ✓</div>
            </div>
            <div className="mb-3 bg-green-50 border border-green-200 rounded-lg p-3">
              <p className="text-xs text-green-700">Your progress is automatically synced across all your devices.</p>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button onClick={onSignOut}
                className="px-4 py-2 bg-white text-gray-700 text-sm font-medium rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                Sign out
              </button>
              <button onClick={() => setShowManualSync(!showManualSync)}
                className="px-4 py-2 text-gray-700 text-sm font-medium rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                {showManualSync ? 'Hide' : 'Show'} Manual Options
              </button>
            </div>
          </>
        ) : (
          <>
            <h3 className="font-bold text-gray-900 mb-2">Sync Between Devices</h3>
            <p className="text-xs text-gray-500 mb-4">Sign in with Google to sync your progress automatically across devices.</p>
            <div className="mb-3 bg-blue-50 border border-blue-200 rounded-lg p-3">
              <button onClick={onSignIn}
                className="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-500 transition-colors w-full">
                Sign in with Google
              </button>
            </div>
            <p className="text-xs text-gray-500 mb-3">Or use manual options below:</p>
            <button onClick={() => setShowManualSync(!showManualSync)}
              className="text-xs text-gray-600 font-medium hover:text-gray-900 mb-3">
              {showManualSync ? 'Hide' : 'Show'} Export/Import/Reset
            </button>
          </>
        )}

        {showManualSync && (
          <div className="mt-4 pt-4 border-t border-gray-200">
            <p className="text-xs text-gray-500 mb-3">Export your progress from one device, import on another.</p>
            <div className="flex gap-3 flex-wrap">
              <button onClick={() => {
                const data = JSON.stringify(completed);
                if (navigator.clipboard) {
                  navigator.clipboard.writeText(data).then(() => {
                    setSyncMsg('Copied to clipboard! Paste this into Import on your other device.');
                    setTimeout(() => setSyncMsg(''), 4000);
                  });
                } else {
                  const ta = document.createElement('textarea');
                  ta.value = data; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                  document.body.removeChild(ta);
                  setSyncMsg('Copied to clipboard!');
                  setTimeout(() => setSyncMsg(''), 4000);
                }
              }} className="px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-700 transition-colors">
                Export Progress
              </button>
              <button onClick={() => setShowImport(!showImport)}
                className="px-4 py-2 bg-white text-gray-700 text-sm font-medium rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                Import Progress
              </button>
              <button onClick={() => {
                if (window.confirm('This will erase all progress. Are you sure?')) {
                  setCompleted({});
                  saveState({});
                  setSyncMsg('Progress reset.');
                  setTimeout(() => setSyncMsg(''), 3000);
                }
              }} className="px-4 py-2 bg-white text-red-600 text-sm font-medium rounded-lg border border-red-200 hover:bg-red-50 transition-colors">
                Reset All
              </button>
            </div>
            {syncMsg && <div className="mt-2 text-sm text-green-600 font-medium fade-in">{syncMsg}</div>}
            {showImport && (
              <div className="mt-3 fade-in">
                <textarea placeholder="Paste exported data here..." value={importText} onChange={e => setImportText(e.target.value)}
                  className="w-full h-20 p-2 border rounded-lg text-xs font-mono focus:outline-none focus:ring-2 focus:ring-gray-300" />
                <button onClick={() => {
                  try {
                    const parsed = JSON.parse(importText);
                    if (typeof parsed === 'object') {
                      const merged = { ...completed, ...parsed };
                      setCompleted(merged);
                      saveState(merged);
                      setSyncMsg(`Imported! ${Object.keys(parsed).length} entries merged.`);
                      setShowImport(false);
                      setImportText('');
                      setTimeout(() => setSyncMsg(''), 4000);
                    }
                  } catch { setSyncMsg('Invalid data. Make sure you pasted the full export.'); setTimeout(() => setSyncMsg(''), 4000); }
                }} className="mt-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-500 transition-colors">
                  Merge Import
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Source */}
      <div className="text-center text-xs text-gray-400 pb-4">
        Cardio: Levine et al. 2018, <em>Circulation</em> — "Reversing the Cardiac Effects of Sedentary Aging in Middle Age"
        <br />Lifting: Eric Evans — <em>From Average to Jacked</em> — Push / Legs / Pull, linear progression
      </div>
    </div>
  );
}

      ))}

      {/* Triceps rotation callout */}
      <div className="bg-amber-50 rounded-2xl p-4 border border-amber-200">
        <h3 className="font-bold text-amber-800 text-sm mb-2">Triceps Rotation (Push day)</h3>
        <p className="text-xs text-amber-700">The two triceps slots swap to their alternate <strong>every other week</strong>, so you hit all four movements across a two-week cycle:</p>
        <div className="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-amber-800">
          <div className="bg-white rounded-lg p-2 border border-amber-200">Slot 4: <strong>Skull Crushers</strong> ⇄ Tricep Extension (overhead)</div>
          <div className="bg-white rounded-lg p-2 border border-amber-200">Slot 5: <strong>DB Kickback</strong> ⇄ Tricep Pushdown</div>
        </div>
      </div>

      {/* Substitutions — the back page */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border">
        <h3 className="font-bold text-gray-900 mb-1">Substitutions</h3>
        <p className="text-xs text-gray-500 mb-4">Swap any movement for one in its slot — same muscle, whatever your gym has. (The old "alternate exercises" list, replaced.)</p>
        <div className="space-y-5">
          {subs.map((s, i) => (
            <div key={i}>
              <div className="text-sm font-bold mb-2 px-2 py-1 rounded inline-block" style={{ color: s.color, background: s.bg }}>{s.day}</div>
              <div className="space-y-2">
                {s.slots.map((sl, j) => (
                  <div key={j} className="border-l-2 pl-3" style={{ borderColor: s.color }}>
                    <div className="text-xs font-semibold text-gray-800">{sl.slot}</div>
                    <div className="text-[11px] text-gray-500 mt-0.5">{sl.alts.join('  ·  ')}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Source */}
      <div className="text-center text-xs text-gray-400 pb-4">
        Lifting protocol: Eric Evans — <em>From Average to Jacked</em> (youtube.com/@Averagetojacked)
        <br />Synthesized from Huberman and others into simple linear progression. Cardio engine: the Levine Protocol (see Stats tab).
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState(0);
  const [completed, setCompleted] = useState(loadState);
  const [notes, setNotes] = useState(loadNotes);
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [hasInitialized, setHasInitialized] = useState(false);
  const cw = curWeek();

  // Debounced note sync
  const noteSyncTimersRef = useRef({});
  const handleNoteChange = useCallback((dateKey, noteText) => {
    setNotes(prev => {
      const next = { ...prev };
      if (noteText && noteText.trim()) {
        next[dateKey] = noteText;
      } else {
        delete next[dateKey];
      }
      saveNotes(next);

      // Debounce sync to Supabase
      if (user) {
        if (noteSyncTimersRef.current[dateKey]) {
          clearTimeout(noteSyncTimersRef.current[dateKey]);
        }
        noteSyncTimersRef.current[dateKey] = setTimeout(() => {
          syncNote(user.id, dateKey, noteText);
        }, 1000);
      }

      return next;
    });
  }, [user]);

  // Auth state management
  useEffect(() => {
    let subscription = null;

    // Safety timeout — never stay on loading screen more than 3 seconds
    const safetyTimer = setTimeout(() => {
      setAuthLoading(false);
    }, 3000);

    const initAuth = async () => {
      try {
        // Set up auth listener first
        const { data } = sb.auth.onAuthStateChange(async (event, session) => {
          try {
            if (session?.user) {
              setUser(session.user);
              const supabaseData = await loadFromSupabase(session.user.id);
              const supabaseNotes = await loadNotesFromSupabase(session.user.id);
              const merged = { ...completed, ...supabaseData };
              const mergedNotes = { ...notes, ...supabaseNotes };
              setCompleted(merged);
              setNotes(mergedNotes);
              saveState(merged);
              saveNotes(mergedNotes);
              await bulkSync(session.user.id, merged);
            } else {
              setUser(null);
            }
          } catch (err) {
            console.error('Error in auth state change:', err);
          }
        });
        subscription = data?.subscription;

        // Get existing session
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user) {
          setUser(session.user);
          const supabaseData = await loadFromSupabase(session.user.id);
          const supabaseNotes = await loadNotesFromSupabase(session.user.id);
          const merged = { ...completed, ...supabaseData };
          const mergedNotes = { ...notes, ...supabaseNotes };
          setCompleted(merged);
          setNotes(mergedNotes);
          saveState(merged);
          saveNotes(mergedNotes);
          await bulkSync(session.user.id, merged);
        }
      } catch (err) {
        console.error('Error initializing auth:', err);
      } finally {
        clearTimeout(safetyTimer);
        setAuthLoading(false);
      }
    };

    initAuth();

    return () => {
      clearTimeout(safetyTimer);
      subscription?.unsubscribe();
    };
  }, []);

  const toggle = useCallback((key) => {
    setCompleted(prev => {
      const next = { ...prev };
      const isCompleted = !next[key];
      if (next[key]) delete next[key]; else next[key] = true;
      saveState(next);

      if (user) {
        syncToggle(user.id, key, isCompleted);
      }

      return next;
    });
  }, [user]);

  const handleSignIn = async () => {
    try {
      const redirectUrl = window.location.origin + window.location.pathname;
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: redirectUrl
        }
      });
    } catch (err) {
      console.error('Sign in error:', err);
    }
  };

  const handleSignOut = async () => {
    try {
      await sb.auth.signOut();
      setUser(null);
    } catch (err) {
      console.error('Sign out error:', err);
    }
  };

  // Determine which phase tab to show on load (must be before early return to maintain hook order)
  useEffect(() => {
    if (!hasInitialized && !authLoading) {
      const currentPhaseIdx = PHASES.findIndex(p => cw >= p.ws && cw <= p.we);
      if (currentPhaseIdx >= 0) {
        setTab(currentPhaseIdx);
      }
      setHasInitialized(true);
    }
  }, [hasInitialized, authLoading]);

  if (authLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: '#1e293b' }}>
        <div className="text-center">
          <div className="text-xl font-bold text-white mb-2">LEVINE PROTOCOL</div>
          <div className="text-sm text-gray-400">Loading your data...</div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-8">
      <TopBar cw={cw} completed={completed} user={user} onSignIn={handleSignIn} onSignOut={handleSignOut} />
      <TabNav active={tab} onChange={setTab} />
      {tab === 4 ? (
        <LiftingGuide />
      ) : tab === 5 ? (
        <StatsView cw={cw} completed={completed} setCompleted={setCompleted} setNotes={setNotes} onTabChange={setTab} user={user} onSignIn={handleSignIn} onSignOut={handleSignOut} />
      ) : (
        <PhaseView phaseIdx={tab} cw={cw} completed={completed} notes={notes} onToggle={toggle} onNoteChange={handleNoteChange} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
